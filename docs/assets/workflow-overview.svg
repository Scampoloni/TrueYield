<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">TrueYield role-based audit workflow</title>
  <desc id="description">Auth0 protects a four-stage workflow in which fund managers submit portfolios, the system enriches evidence, auditors make the human decision, and compliance officers review the resulting audit trail.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" class="connector-fill"/>
    </marker>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --border: #cbd5e1;
      --line: #64748b;
      --text: #0f172a;
      --muted: #475569;
      --fund-surface: #ecfdf5;
      --fund-accent: #059669;
      --evidence-surface: #eff6ff;
      --evidence-accent: #2563eb;
      --audit-surface: #fffbeb;
      --audit-accent: #d97706;
      --compliance-surface: #f5f3ff;
      --compliance-accent: #7c3aed;
      --auth-surface: #e0f2fe;
      --auth-accent: #0284c7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0d1117;
        --surface: #111827;
        --surface-soft: #172033;
        --border: #334155;
        --line: #64748b;
        --text: #f8fafc;
        --muted: #a7b4c8;
        --fund-surface: #0d2924;
        --fund-accent: #34d399;
        --evidence-surface: #16243a;
        --evidence-accent: #60a5fa;
        --audit-surface: #30250f;
        --audit-accent: #fbbf24;
        --compliance-surface: #281d42;
        --compliance-accent: #a78bfa;
        --auth-surface: #102b40;
        --auth-accent: #38bdf8;
      }
    }

    text {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: var(--text);
      text-rendering: geometricPrecision;
    }

    .canvas { fill: var(--canvas); stroke: var(--border); }
    .auth-panel { fill: var(--auth-surface); stroke: var(--auth-accent); }
    .fund-card { fill: var(--fund-surface); stroke: var(--fund-accent); }
    .evidence-card { fill: var(--evidence-surface); stroke: var(--evidence-accent); }
    .audit-card { fill: var(--audit-surface); stroke: var(--audit-accent); }
    .compliance-card { fill: var(--compliance-surface); stroke: var(--compliance-accent); }
    .fund-accent { fill: var(--fund-accent); }
    .evidence-accent { fill: var(--evidence-accent); }
    .audit-accent { fill: var(--audit-accent); }
    .compliance-accent { fill: var(--compliance-accent); }
    .auth-accent { fill: var(--auth-accent); }
    .connector { stroke: var(--line); }
    .connector-fill { fill: var(--line); }
    .divider { stroke: var(--border); }
    .assurance { fill: var(--surface-soft); stroke: var(--border); }
    .step-circle { fill: var(--surface-soft); stroke: var(--border); }
    .role-pill { fill: var(--surface); stroke: var(--border); }
    .title { font-size: 20px; font-weight: 600; }
    .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; fill: var(--muted); }
    .step-title { font-size: 13px; font-weight: 600; }
    .step-detail { font-size: 11px; fill: var(--muted); }
    .step-number { font-size: 10px; font-weight: 700; fill: var(--muted); }
    .auth-title { font-size: 18px; font-weight: 650; }
    .auth-detail { font-size: 12px; fill: var(--muted); }
    .role-label { font-size: 10px; font-weight: 650; fill: var(--muted); }
    .assurance-text { font-size: 11.5px; font-weight: 550; fill: var(--muted); }
  </style>

  <rect class="canvas" x="8" y="8" width="1264" height="404" rx="20"/>

  <!-- Authentication and authorization control plane -->
  <rect class="auth-panel" x="24" y="24" width="1232" height="72" rx="14" stroke-width="1.5"/>
  <circle class="auth-accent" cx="58" cy="60" r="19" opacity="0.16"/>
  <path d="M58 46.5 70 51v9.6c0 8.4-5 15.9-12 18.9-7-3-12-10.5-12-18.9V51l12-4.5Z" fill="none" stroke="var(--auth-accent)" stroke-width="2"/>
  <path d="m52.5 61 3.4 3.5 7.6-8" fill="none" stroke="var(--auth-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="kicker" x="90" y="47">ACCESS CONTROL</text>
  <text class="auth-title" x="90" y="70">Auth0 authentication → JWT validation → backend role enforcement</text>
  <text class="auth-detail" x="90" y="87">Every API action is authorized against the signed-in user’s role claim.</text>

  <text class="kicker" x="831" y="43">AUTHORIZED ROLES</text>
  <g>
    <rect class="role-pill" x="831" y="52" width="122" height="27" rx="13.5"/>
    <circle class="fund-accent" cx="848" cy="65.5" r="4"/>
    <text class="role-label" x="859" y="69">FUND MANAGER</text>
  </g>
  <g>
    <rect class="role-pill" x="963" y="52" width="92" height="27" rx="13.5"/>
    <circle class="audit-accent" cx="980" cy="65.5" r="4"/>
    <text class="role-label" x="991" y="69">AUDITOR</text>
  </g>
  <g>
    <rect class="role-pill" x="1065" y="52" width="169" height="27" rx="13.5"/>
    <circle class="compliance-accent" cx="1082" cy="65.5" r="4"/>
    <text class="role-label" x="1093" y="69">COMPLIANCE OFFICER</text>
  </g>

  <!-- Stage 1: Fund manager -->
  <g filter="url(#shadow)">
    <rect class="fund-card" x="24" y="116" width="294" height="238" rx="14" stroke-width="1.5"/>
    <path class="fund-accent" d="M38 116h266a14 14 0 0 1 14 14v1H24v-1a14 14 0 0 1 14-14Z"/>
  </g>
  <text class="kicker" x="42" y="151">ROLE · FUND MANAGER</text>
  <text class="title" x="42" y="174">Prepare the review</text>
  <circle class="step-circle" cx="286" cy="153" r="16"/>
  <text class="step-number" x="286" y="156.5" text-anchor="middle">01</text>
  <line class="divider" x1="42" y1="187" x2="300" y2="187"/>

  <circle class="step-circle" cx="53" cy="208" r="11"/>
  <text class="step-number" x="53" y="211" text-anchor="middle">1</text>
  <text class="step-title" x="73" y="205">Build the portfolio</text>
  <text class="step-detail" x="73" y="221">Create and maintain holdings</text>

  <circle class="step-circle" cx="53" cy="255" r="11"/>
  <text class="step-number" x="53" y="258" text-anchor="middle">2</text>
  <text class="step-title" x="73" y="252">Open an audit report</text>
  <text class="step-detail" x="73" y="268">Select scope and review context</text>

  <circle class="step-circle" cx="53" cy="302" r="11"/>
  <text class="step-number" x="53" y="305" text-anchor="middle">3</text>
  <text class="step-title" x="73" y="299">Submit for review</text>
  <text class="step-detail" x="73" y="315">Start the evidence workflow</text>

  <!-- Stage 2: Evidence pipeline -->
  <g filter="url(#shadow)">
    <rect class="evidence-card" x="336" y="116" width="294" height="238" rx="14" stroke-width="1.5"/>
    <path class="evidence-accent" d="M350 116h266a14 14 0 0 1 14 14v1H336v-1a14 14 0 0 1 14-14Z"/>
  </g>
  <text class="kicker" x="354" y="151">SYSTEM · EVIDENCE PIPELINE</text>
  <text class="title" x="354" y="174">Enrich the context</text>
  <circle class="step-circle" cx="598" cy="153" r="16"/>
  <text class="step-number" x="598" y="156.5" text-anchor="middle">02</text>
  <line class="divider" x1="354" y1="187" x2="612" y2="187"/>

  <circle class="step-circle" cx="365" cy="208" r="11"/>
  <text class="step-number" x="365" y="211" text-anchor="middle">1</text>
  <text class="step-title" x="385" y="205">Capture source links</text>
  <text class="step-detail" x="385" y="221">Create an auditable evidence record</text>

  <circle class="step-circle" cx="365" cy="255" r="11"/>
  <text class="step-number" x="365" y="258" text-anchor="middle">2</text>
  <text class="step-title" x="385" y="252">Enrich when configured</text>
  <text class="step-detail" x="385" y="268">Optional news and AI summary</text>

  <circle class="step-circle" cx="365" cy="302" r="11"/>
  <text class="step-number" x="365" y="305" text-anchor="middle">3</text>
  <text class="step-title" x="385" y="299">Prepare the review queue</text>
  <text class="step-detail" x="385" y="315">AI_ANALYZING → PENDING_REVIEW</text>

  <!-- Stage 3: Auditor -->
  <g filter="url(#shadow)">
    <rect class="audit-card" x="648" y="116" width="294" height="238" rx="14" stroke-width="1.5"/>
    <path class="audit-accent" d="M662 116h266a14 14 0 0 1 14 14v1H648v-1a14 14 0 0 1 14-14Z"/>
  </g>
  <text class="kicker" x="666" y="151">ROLE · AUDITOR</text>
  <text class="title" x="666" y="174">Own the decision</text>
  <circle class="step-circle" cx="910" cy="153" r="16"/>
  <text class="step-number" x="910" y="156.5" text-anchor="middle">03</text>
  <line class="divider" x1="666" y1="187" x2="924" y2="187"/>

  <circle class="step-circle" cx="677" cy="208" r="11"/>
  <text class="step-number" x="677" y="211" text-anchor="middle">1</text>
  <text class="step-title" x="697" y="205">Claim the review queue</text>
  <text class="step-detail" x="697" y="221">PENDING_REVIEW → UNDER_REVIEW</text>

  <circle class="step-circle" cx="677" cy="255" r="11"/>
  <text class="step-number" x="677" y="258" text-anchor="middle">2</text>
  <text class="step-title" x="697" y="252">Validate the evidence</text>
  <text class="step-detail" x="697" y="268">Holdings, sources and AI context</text>

  <circle class="step-circle" cx="677" cy="302" r="11"/>
  <text class="step-number" x="677" y="305" text-anchor="middle">3</text>
  <text class="step-title" x="697" y="299">Record a human decision</text>
  <text class="step-detail" x="697" y="315">Approve or reject with comments</text>

  <!-- Stage 4: Compliance officer -->
  <g filter="url(#shadow)">
    <rect class="compliance-card" x="960" y="116" width="294" height="238" rx="14" stroke-width="1.5"/>
    <path class="compliance-accent" d="M974 116h266a14 14 0 0 1 14 14v1H960v-1a14 14 0 0 1 14-14Z"/>
  </g>
  <text class="kicker" x="978" y="151">ROLE · COMPLIANCE OFFICER</text>
  <text class="title" x="978" y="174">Review the outcome</text>
  <circle class="step-circle" cx="1222" cy="153" r="16"/>
  <text class="step-number" x="1222" y="156.5" text-anchor="middle">04</text>
  <line class="divider" x1="978" y1="187" x2="1236" y2="187"/>

  <circle class="step-circle" cx="989" cy="208" r="11"/>
  <text class="step-number" x="989" y="211" text-anchor="middle">1</text>
  <text class="step-title" x="1009" y="205">Monitor all portfolios</text>
  <text class="step-detail" x="1009" y="221">Read-only consolidated view</text>

  <circle class="step-circle" cx="989" cy="255" r="11"/>
  <text class="step-number" x="989" y="258" text-anchor="middle">2</text>
  <text class="step-title" x="1009" y="252">Inspect the final outcome</text>
  <text class="step-detail" x="1009" y="268">Decision, comments and evidence</text>

  <circle class="step-circle" cx="989" cy="302" r="11"/>
  <text class="step-number" x="989" y="305" text-anchor="middle">3</text>
  <text class="step-title" x="1009" y="299">Follow the audit trail</text>
  <text class="step-detail" x="1009" y="315">Role, state and timestamps</text>

  <!-- Handoffs -->
  <line class="connector" x1="318" y1="235" x2="332" y2="235" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="connector" x1="630" y1="235" x2="644" y2="235" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="connector" x1="942" y1="235" x2="956" y2="235" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Accountability statement -->
  <rect class="assurance" x="24" y="370" width="1232" height="34" rx="10"/>
  <circle class="auth-accent" cx="296" cy="387" r="3.5"/>
  <text class="assurance-text" x="307" y="391">Automation prepares context</text>
  <circle class="audit-accent" cx="550" cy="387" r="3.5"/>
  <text class="assurance-text" x="561" y="391">The auditor owns the decision</text>
  <circle class="compliance-accent" cx="837" cy="387" r="3.5"/>
  <text class="assurance-text" x="848" y="391">Every action remains traceable</text>
</svg>

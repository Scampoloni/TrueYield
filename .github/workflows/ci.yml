name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Verify + Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify (tests + JaCoCo report + threshold check)
        run: ./mvnw --batch-mode verify

      - name: Compute coverage summary and warn below 80%
        run: |
          CSV_FILE="target/site/jacoco/jacoco.csv"
          if [ ! -f "$CSV_FILE" ]; then
            echo "JaCoCo report not found at $CSV_FILE"
            exit 1
          fi

          COVERAGE=$(awk -F',' 'NR>1 {miss+=$4; cov+=$5} END {total=miss+cov; if (total==0) print "0.0"; else printf "%.1f", (cov*100)/total}' "$CSV_FILE")
          echo "Overall instruction coverage: ${COVERAGE}%"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instruction coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

          awk -v c="$COVERAGE" 'BEGIN { if (c < 80.0) { exit 0 } else { exit 1 } }'
          if [ $? -eq 0 ]; then
            echo "::warning::Coverage is below target 80% (current: ${COVERAGE}%). Build still passes while >=70% threshold is met."
          fi

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
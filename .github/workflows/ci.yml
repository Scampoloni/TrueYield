name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend Check + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: "http://localhost:8080"
      AUTH0_DOMAIN: "example.auth0.com"
      AUTH0_CLIENT_ID: "ci-placeholder-client-id"
      AUTH0_AUDIENCE: "https://trueyield.api"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Build frontend
        run: npm run build

  backend-tests:
    name: Backend Verify + Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify (tests + JaCoCo report + threshold check)
        run: ./mvnw --batch-mode verify

      - name: Compute coverage summary and warn below 80%
        run: |
          CSV_FILE="target/site/jacoco/jacoco.csv"
          if [ ! -f "$CSV_FILE" ]; then
            echo "JaCoCo report not found at $CSV_FILE"
            exit 1
          fi

          COVERAGE=$(awk -F',' 'NR>1 {miss+=$4; cov+=$5} END {total=miss+cov; if (total==0) print "0.0"; else printf "%.1f", (cov*100)/total}' "$CSV_FILE")
          echo "Overall instruction coverage: ${COVERAGE}%"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instruction coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

          if awk -v c="$COVERAGE" 'BEGIN { exit (c < 80.0) ? 0 : 1 }'; then
            echo "::warning::Coverage is below target 80% (current: ${COVERAGE}%). JaCoCo class-level gate enforces 90% on core services."
          fi

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Generate JaCoCo Coverage Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false
          on-missing-report: quiet
        if: github.ref == 'refs/heads/main'

      - name: Commit and push coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "ci: update coverage badge [skip ci]"
          file_pattern: .github/badges/*.svg
          push_options: "--force-with-lease"
        if: github.ref == 'refs/heads/main'

      - name: SonarCloud Analysis
        run: ./mvnw sonar:sonar -Dsonar.projectKey=Scampoloni_trueyield -Dsonar.organization=scampoloni -Dsonar.host.url=https://sonarcloud.io
        continue-on-error: false
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

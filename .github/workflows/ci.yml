name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend Check + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: "http://localhost:8080"
      AUTH0_DOMAIN: "example.auth0.com"
      AUTH0_CLIENT_ID: "ci-placeholder-client-id"
      AUTH0_AUDIENCE: "https://trueyield.api"
      ALLOW_SIGNUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend checks
        run: npm run check

      - name: Build frontend
        run: npm run build

  e2e-tests:
    name: E2E Tests (full stack + RBAC)
    runs-on: ubuntu-latest
    needs: frontend-checks

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: "http://localhost:8080"
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      ALLOW_SIGNUP: "false"
      E2E_FUND_MANAGER_EMAIL: ${{ secrets.E2E_FUND_MANAGER_EMAIL }}
      E2E_AUDITOR_EMAIL: ${{ secrets.E2E_AUDITOR_EMAIL }}
      E2E_COMPLIANCE_EMAIL: ${{ secrets.E2E_COMPLIANCE_EMAIL }}
      E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install frontend dependencies
        run: npm ci

      - name: Require role credentials on main
        if: github.ref == 'refs/heads/main'
        run: |
          test -n "$E2E_FUND_MANAGER_EMAIL"
          test -n "$E2E_AUDITOR_EMAIL"
          test -n "$E2E_COMPLIANCE_EMAIL"
          test -n "$E2E_DEMO_PASSWORD"

      - name: Start backend
        run: |
          cd ../backend
          ./mvnw --batch-mode spring-boot:run > /tmp/trueyield-backend.log 2>&1 &
        env:
          MONGODB_URI: mongodb://localhost:27017/trueyield-e2e
          SPRING_AUTOCONFIGURE_EXCLUDE: >-
            org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,
            org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration,
            org.springframework.ai.mcp.server.autoconfigure.McpServerAutoConfiguration,
            org.springframework.ai.mcp.server.autoconfigure.McpWebMvcServerAutoConfiguration

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trueyield-backend.log
          exit 1

      - name: Build frontend
        run: npm run build

      - name: Start frontend server
        run: node build/index.js &
        env:
          PORT: 5173
          HOST: 0.0.0.0

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run Cypress E2E suite
        run: npx cypress run --spec "cypress/e2e/**/*.cy.js"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            /tmp/trueyield-backend.log
            frontend/cypress/screenshots
            frontend/cypress/videos

  backend-tests:
    name: Backend Verify + Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify (tests + JaCoCo report + threshold check)
        run: ./mvnw --batch-mode verify

      - name: Compute coverage summary and warn below 80%
        run: |
          CSV_FILE="target/site/jacoco/jacoco.csv"
          if [ ! -f "$CSV_FILE" ]; then
            echo "JaCoCo report not found at $CSV_FILE"
            exit 1
          fi

          COVERAGE=$(awk -F',' 'NR>1 {miss+=$4; cov+=$5} END {total=miss+cov; if (total==0) print "0.0"; else printf "%.1f", (cov*100)/total}' "$CSV_FILE")
          echo "Overall instruction coverage: ${COVERAGE}%"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instruction coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

          if awk -v c="$COVERAGE" 'BEGIN { exit (c < 80.0) ? 0 : 1 }'; then
            echo "::warning::Coverage is below target 80% (current: ${COVERAGE}%). JaCoCo class-level gate enforces 90% on core services."
          fi

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Generate JaCoCo Coverage Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false
          on-missing-report: quiet
        if: github.ref == 'refs/heads/main'

      - name: Commit and push coverage badge
        uses: stefanzweifel/git-auto-commit-action@v7
        continue-on-error: true
        with:
          commit_message: "ci: update coverage badge [skip ci]"
          file_pattern: .github/badges/*.svg
        if: github.ref == 'refs/heads/main'

      - name: SonarCloud Analysis
        if: github.ref == 'refs/heads/main' && github.repository_owner == 'Scampoloni'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw --batch-mode sonar:sonar \
            -Dsonar.projectKey=Scampoloni_trueyield \
            -Dsonar.organization=scampoloni \
            -Dsonar.host.url=https://sonarcloud.io

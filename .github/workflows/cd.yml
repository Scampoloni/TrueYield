name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-backend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_BACKEND }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-backend:${{ github.event.workflow_run.head_sha }}

      - name: Trigger backend CD webhook
        run: curl --fail --silent --show-error -X POST "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_CD_WEBHOOK_BACKEND }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-frontend:${{ github.event.workflow_run.head_sha }}
          build-args: |
            API_BASE_URL=https://trueyield-backend.azurewebsites.net
            AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            AUTH0_AUDIENCE=https://trueyield.api
            ALLOW_SIGNUP=false

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Trigger frontend CD webhook
        run: curl --fail --silent --show-error -X POST "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_CD_WEBHOOK_FRONTEND }}

  verify-production:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: Verify backend readiness
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 10 --retry-all-errors \
            https://trueyield-backend.azurewebsites.net/actuator/health

      - name: Verify frontend login
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://trueyield-frontend.azurewebsites.net/login > /dev/null

      - name: Verify protected API rejects anonymous access
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            https://trueyield-backend.azurewebsites.net/api/portfolio)
          test "$STATUS" = "401"

name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-backend:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_BACKEND }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-backend:${{ github.sha }}

      - name: Force backend container restart via Kudu
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, subprocess, sys, os

          profile = os.environ["PUBLISH_PROFILE"]
          root = ET.fromstring(profile)
          cred = next(
              p for p in root.findall(".//publishProfile")
              if p.get("publishMethod") == "MSDeploy"
          )
          username = cred.get("userName")
          password = cred.get("userPWD")
          app = os.environ["APP_NAME"]

          result = subprocess.run([
              "curl", "--fail", "--silent", "--show-error",
              "-X", "POST",
              f"https://{app}.scm.azurewebsites.net/docker/restart",
              "-u", f"{username}:{password}"
          ], capture_output=True, text=True)

          print(result.stdout or result.stderr or "Restart triggered")
          sys.exit(result.returncode)
          EOF
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_PUBLISH_PROFILE_BACKEND }}
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-frontend:${{ github.sha }}
          build-args: |
            API_BASE_URL=https://trueyield-backend.azurewebsites.net
            AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            AUTH0_AUDIENCE=https://trueyield.api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/trueyield-frontend:${{ github.sha }}

      - name: Force frontend container restart via Kudu
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, subprocess, sys, os

          profile = os.environ["PUBLISH_PROFILE"]
          root = ET.fromstring(profile)
          cred = next(
              p for p in root.findall(".//publishProfile")
              if p.get("publishMethod") == "MSDeploy"
          )
          username = cred.get("userName")
          password = cred.get("userPWD")
          app = os.environ["APP_NAME"]

          result = subprocess.run([
              "curl", "--fail", "--silent", "--show-error",
              "-X", "POST",
              f"https://{app}.scm.azurewebsites.net/docker/restart",
              "-u", f"{username}:{password}"
          ], capture_output=True, text=True)

          print(result.stdout or result.stderr or "Restart triggered")
          sys.exit(result.returncode)
          EOF
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}

spring.application.name=trueyield

# CORS
cors.allowed-origins=http://localhost:5173,https://trueyield-frontend.azurewebsites.net

# MongoDB (Spring Boot 3.x property)
spring.data.mongodb.uri=${MONGODB_URI}

# Application logging — INFO for our own code so news ingestion progress is visible
logging.level.ch.zhaw.trueyield=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Auth0 JWT Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/

# Disable MongoDB health indicator (Atlas restricts access to admin db)
management.health.mongo.enabled=false

# Spring AI - Anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.options.max-tokens=512

# News APIs
# Guardian
news.api.guardian.base-url=https://content.guardianapis.com
news.api.guardian.key=${GUARDIAN_API_KEY:}

# Newsdata.io
news.api.newsdata.base-url=https://newsdata.io/api/1
news.api.newsdata.key=${NEWSDATA_API_KEY:}

# NewsAPI.org
news.api.newsapiorg.base-url=https://newsapi.org/v2
news.api.newsapiorg.key=${NEWSAPIORG_API_KEY:}

# Alpha Vantage (symbol-based ESG news — primary provider for ticker-specific articles)
news.api.alphavantage.base-url=https://www.alphavantage.co
news.api.alphavantage.key=${ALPHAVANTAGE_API_KEY:}

# MCP Server — exposes ESG analysis tools for AI clients (e.g. Claude Desktop)
spring.ai.mcp.server.name=trueyield-esg
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
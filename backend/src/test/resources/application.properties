# Provide a dummy JWK endpoint for tests to satisfy security configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json
auth0.audience=https://trueyield.api

spring.mongodb.uri=mongodb://localhost:27017/trueyield-test
spring.autoconfigure.exclude=org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration,org.springframework.ai.mcp.server.autoconfigure.McpServerAutoConfiguration,org.springframework.ai.mcp.server.autoconfigure.McpWebMvcServerAutoConfiguration
